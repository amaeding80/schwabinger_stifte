<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 295" aria-hidden="true">
  <defs>
    <!-- Simulates the organic, irregular edges of a real paint handprint -->
    <filter id="paint" x="-22%" y="-22%" width="144%" height="144%">
      <feTurbulence type="turbulence" baseFrequency="0.028" numOctaves="5" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="10" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <!-- Hand shapes, distorted by filter to look like a real paint print -->
  <g fill="#D85C2A" filter="url(#paint)">
    <!-- Palm -->
    <ellipse cx="118" cy="212" rx="66" ry="54"/>
    <!-- Thumb (lower-left, strongly angled outward) -->
    <ellipse cx="40" cy="186" rx="23" ry="50" transform="rotate(-44 40 186)"/>
    <!-- Index finger -->
    <ellipse cx="80" cy="116" rx="20" ry="62" transform="rotate(-11 80 116)"/>
    <!-- Middle finger (tallest) -->
    <ellipse cx="112" cy="96" rx="20" ry="70" transform="rotate(-2 112 96)"/>
    <!-- Ring finger -->
    <ellipse cx="146" cy="103" rx="18" ry="65" transform="rotate(10 146 103)"/>
    <!-- Pinky (shortest) -->
    <ellipse cx="174" cy="124" rx="15" ry="50" transform="rotate(21 174 124)"/>
  </g>
</svg>
