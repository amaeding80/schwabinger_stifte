<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Handabdruck Versionen – Auswahl</title>
<style>
  body { background: #f5f0e8; font-family: Arial, sans-serif; padding: 30px; margin: 0; }
  h1 { text-align: center; color: #333; margin-bottom: 30px; font-size: 22px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; max-width: 900px; margin: 0 auto; }
  .card { background: white; border-radius: 12px; padding: 20px; text-align: center; box-shadow: 0 3px 12px rgba(0,0,0,0.12); }
  .card h2 { margin: 0 0 15px; color: #D85C2A; font-size: 18px; }
  .card img { width: 100%; max-width: 380px; height: auto; border-radius: 8px; }
  .label { margin-top: 10px; font-size: 13px; color: #666; }
</style>
</head>
<body>
<h1>🎨 Handabdruck-Versionen – Welche gefällt dir besser?</h1>
<div class="grid">
  <div class="card">
    <h2>Version C</h2>
    <img src="https://d8j0ntlcm91z4.cloudfront.net/user_3ENpDNZsYzrcWJrGVnPvDZbFyq0/hf_20260601_071553_7c856d2a-3ef5-42ea-8afe-127655ac44ad.png" alt="Version C">
    <div class="label">KI-generierter Kinderhandabdruck, Variante C</div>
  </div>
  <div class="card">
    <h2>Version D</h2>
    <img src="https://d8j0ntlcm91z4.cloudfront.net/user_3ENpDNZsYzrcWJrGVnPvDZbFyq0/hf_20260601_071553_09803fcc-11c7-4930-aa42-0b2637aa33eb.png" alt="Version D">
    <div class="label">KI-generierter Kinderhandabdruck, Variante D</div>
  </div>
</div>
</body>
</html>
